# Cloudflare Worker config for demo-mcp.
#
# Local dev:  wrangler dev (uses local D1 SQLite at .wrangler/state-mcp/v3/d1/)
# Production: wrangler deploy + wrangler d1 migrations apply demo-mcp
#
# D1 holds profiles + token_usage (JTI replay tracking).

name = "demo-mcp"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8788
local_protocol = "http"

[[d1_databases]]
binding = "DB"
database_name = "demo-mcp"
database_id = "a7c95b56-8753-47ae-a044-446d5d37cf58"   # overwrite per env in production
migrations_dir = "migrations"

[vars]
RPC_URL = "http://127.0.0.1:8545"
CHAIN_ID = "31337"
MCP_AUDIENCE = "urn:mcp:server:person"
# spec 278 P4: the vault is per-person-keyed (no global VAULT_MASTER_KEY / local-aes).
# Each person's KEK lives in GCP Cloud KMS, resolved from their VaultKeyBinding;
# GCP_SERVICE_ACCOUNT_JSON is a wrangler SECRET (set by set-cloudflare-secrets.sh).
# spec 277 Phase 6: enable the OPEN demo authorization endpoint (/oauth/token).
# Fail-closed — the route 404s unless this is 'true'. Testnet demo only (mock
# seed data); a real production leaves it unset and wires a real AS + JWKS.
DEMO_OAUTH_MINT_ENABLED = "false"
# spec 278: enable the on-demand KEK provisioning endpoint (/custody/vault-key/provision).
# Fail-closed — 404s unless 'true'. Testnet-only convenience (wields the admin credential +
# creates a cost-bearing GCP key per owner); production leaves it unset + provisions out of band.
DEMO_VAULT_PROVISION_ENABLED = "true"
# mcp-provision-unauth-prod (2026-07-04 self-audit): the provision route now requires an owner-control
# proof (ERC-1271 over a freshness challenge) by DEFAULT. This testnet-only flag skips that proof so the
# live ceremony can auto-provision until its client callers sign the challenge. A real deployment leaves
# this UNSET ⇒ proof enforced. Allowlisted in check-fail-open-knobs.ts.
DEMO_VAULT_PROVISION_SKIP_PROOF = "false"
# spec 287: enable the PUBLIC NATIVE MCP ingress (/mcp/native) requiring a per-call
# AgenticInvocationProofV1. Fail-closed — 404s unless 'true'. Requires UNIVERSAL_SIGNATURE_VALIDATOR.
DEMO_NATIVE_MCP_ENABLED = "true"
# The on-chain ECDSA/ERC-1271/6492 validator. Binding enforcement FAILS CLOSED without it — the code
# asks for it, this file only ever mentioned it in a comment, and demo-a2a has carried the same
# address all along. It went unnoticed because the deployed build predated the enforcement: the next
# deploy activated a check whose configuration had never been added, and every coordination vault
# read began failing with "internal error". Same value as demo-a2a + contracts/deployments.
UNIVERSAL_SIGNATURE_VALIDATOR = "0x3bc65655d4b6fb57731A256fcd47Db2F8Fe36907"

[env.faithnet]
name = "demo-mcp-faithnet"
workers_dev = true

[env.faithnet.vars]
UNIVERSAL_SIGNATURE_VALIDATOR = "0xeDd56f500325D4701B9985A34e5Fa6EED6716137"
DELEGATION_MANAGER = "0x710cb1bF08C234Df397e0910331e0A29710EF4F7"
TIMESTAMP_ENFORCER = "0x73A7B878168b7DE48677617179A8bE894f0Dfe96"
ALLOWED_TARGETS_ENFORCER = "0x2156311097A936de1916a878bF53Bfd43c7b5715"
ALLOWED_METHODS_ENFORCER = "0xdBb2E47793393C499efB0f3fcbf6Ca8669791a41"
VALUE_ENFORCER = "0x8759c1a6cEBF1D5069e9434EF46327Bf2ef69975"
CHAIN_ID = "34348"
MCP_AUDIENCE = "urn:mcp:server:person"
DEMO_OAUTH_MINT_ENABLED = "false"
DEMO_VAULT_PROVISION_ENABLED = "true"
DEMO_VAULT_PROVISION_SKIP_PROOF = "false"
DEMO_NATIVE_MCP_ENABLED = "true"
SA_BUDGET_LIMIT_UNITS = "50000"
# Stage-2 soft per-principal verified-call limiter (spec 290 §6). Default 120/60s is too tight for this
# DEMO's read patterns — an active Today page polling several reads every few seconds, a 100+ message
# inbox, and rapid multi-page navigation saturated it and surfaced the throttle as "auth failed" (2026-10-03,
# nathan). Raised to give headroom; it is a soft traffic limiter (abuse protection), not an authority gate,
# and the cross-isolate HARD budget is still SA_BUDGET_LIMIT_UNITS. Paired with the batched message-body
# read (one get_vault_records per thread instead of one per message), which removed the real spike.
STAGE2_VERIFIED_LIMIT = "600"
DEMO_REQUIRE_GATEWAY_ASSERTION = "false"
# AKCS — both halves of the A2A→MCP hop must agree on the MAC mechanism. demo-a2a generates service
# MACs from the tenant MAC root; a demo-mcp still on gcp-kms verified with a local A2A_MAC_SECRET and
# rejected every call ("service-mac rejected"). MAC keys are derived from the tenant root, so there is
# no key id here — only the tenant.
A2A_KMS_BACKEND = "agentic-kms"
AKCS_BASE_URL = "https://akcs-pilot.faithnet.io"
AKCS_TENANT_ID = "faithnet"
# AKCS_TOKEN is a SECRET (wrangler secret put).

[[env.faithnet.d1_databases]]
binding = "DB"
database_name = "demo-mcp-faithnet"
database_id = "68afe2d0-412b-4c6f-b265-1794775d24a3"
migrations_dir = "migrations"

[[env.faithnet.durable_objects.bindings]]
name = "SA_BUDGET"
class_name = "SmartAgentBudgetDO"

[[env.faithnet.migrations]]
tag = "v1"
new_sqlite_classes = ["SmartAgentBudgetDO"]

[[env.faithnet.routes]]
pattern = "mcp.faithnet.io"
custom_domain = true
