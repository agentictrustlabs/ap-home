# Cloudflare Worker config for demo-mcp.
#
# Local dev:  wrangler dev (uses local D1 SQLite at .wrangler/state-mcp/v3/d1/)
# Production: wrangler deploy + wrangler d1 migrations apply demo-mcp
#
# D1 holds profiles + token_usage (JTI replay tracking).

name = "demo-mcp"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8788
local_protocol = "http"

[[d1_databases]]
binding = "DB"
database_name = "demo-mcp"
database_id = "a7c95b56-8753-47ae-a044-446d5d37cf58"   # overwrite per env in production
migrations_dir = "migrations"

[vars]
RPC_URL = "http://127.0.0.1:8545"
CHAIN_ID = "31337"
MCP_AUDIENCE = "urn:mcp:server:person"
# spec 278 P4: the vault is per-person-keyed (no global VAULT_MASTER_KEY / local-aes).
# Each person's KEK lives in GCP Cloud KMS, resolved from their VaultKeyBinding;
# GCP_SERVICE_ACCOUNT_JSON is a wrangler SECRET (set by set-cloudflare-secrets.sh).
# spec 277 Phase 6: enable the OPEN demo authorization endpoint (/oauth/token).
# Fail-closed — the route 404s unless this is 'true'. Testnet demo only (mock
# seed data); a real production leaves it unset and wires a real AS + JWKS.
DEMO_OAUTH_MINT_ENABLED = "false"
# spec 278: enable the on-demand KEK provisioning endpoint (/custody/vault-key/provision).
# Fail-closed — 404s unless 'true'. Testnet-only convenience (wields the admin credential +
# creates a cost-bearing GCP key per owner); production leaves it unset + provisions out of band.
DEMO_VAULT_PROVISION_ENABLED = "true"
# mcp-provision-unauth-prod (2026-07-04 self-audit): the provision route now requires an owner-control
# proof (ERC-1271 over a freshness challenge) by DEFAULT. This testnet-only flag skips that proof so the
# live ceremony can auto-provision until its client callers sign the challenge. A real deployment leaves
# this UNSET ⇒ proof enforced. Allowlisted in check-fail-open-knobs.ts.
DEMO_VAULT_PROVISION_SKIP_PROOF = "false"
# spec 287: enable the PUBLIC NATIVE MCP ingress (/mcp/native) requiring a per-call
# AgenticInvocationProofV1. Fail-closed — 404s unless 'true'. Requires UNIVERSAL_SIGNATURE_VALIDATOR.
DEMO_NATIVE_MCP_ENABLED = "true"
# The on-chain ECDSA/ERC-1271/6492 validator. Binding enforcement FAILS CLOSED without it — the code
# asks for it, this file only ever mentioned it in a comment, and demo-a2a has carried the same
# address all along. It went unnoticed because the deployed build predated the enforcement: the next
# deploy activated a check whose configuration had never been added, and every coordination vault
# read began failing with "internal error". Same value as demo-a2a + contracts/deployments.
UNIVERSAL_SIGNATURE_VALIDATOR = "0x3bc65655d4b6fb57731A256fcd47Db2F8Fe36907"

# ──────────────────────────────────────────────────────────────────────────
# Production environment — Worker name: "demo-mcp-production"
#
# Deploy via `pnpm deploy:cloudflare`. Contract addresses are injected via
# `--var` flags from deployments-base-sepolia.json at deploy time.
#
# REQUIRED ONE-TIME SETUP — paste the production D1 database_id below after:
#   wrangler d1 create demo-mcp
#   wrangler d1 migrations apply demo-mcp --remote --env production
# The deploy script re-runs `migrations apply` on every deploy (idempotent).
# ──────────────────────────────────────────────────────────────────────────

[env.production.vars]
# The on-chain ECDSA/ERC-1271/6492 validator. Binding enforcement FAILS CLOSED without it — the code
# asks for it, this file only ever mentioned it in a comment, and demo-a2a has carried the same
# address all along. It went unnoticed because the deployed build predated the enforcement: the next
# deploy activated a check whose configuration had never been added, and every coordination vault
# read began failing with "internal error". Same value as demo-a2a + contracts/deployments.
UNIVERSAL_SIGNATURE_VALIDATOR = "0x3bc65655d4b6fb57731A256fcd47Db2F8Fe36907"
# The contract every revocation read is aimed at — `Env` declares it required and four call sites read
# it, but it was never set here, so `to: undefined` made every read THROW. The resilient reader is
# fail-closed by construction (an unconfirmable read comes back revoked:true, source='fail-closed:*'),
# so a missing address did not read as misconfiguration: it read as "this delegation is revoked", and
# rejected with "revocation check unavailable; refusing to verify". Exactly the USV omission above,
# one line down, surfaced by the same deploy — the reader is only BUILT once USV is present.
# Canonical Base Sepolia value: packages/contracts/deployments-base-sepolia.json, matching demo-a2a.
# (demo-edge production carries 0x3a8E2c… instead — a different deployment, and worth reconciling.)
DELEGATION_MANAGER = "0x9eD1dC0FD2284fcd4967beeF3317129fee7a92e5"
# The caveat enforcers, and the THIRD omission of this exact shape in this one block. The evaluator
# keys its dispatch table by enforcer ADDRESS and denies anything it cannot name — so with these four
# unset, every caveat on every delegation resolved to "caveat denied (unknown enforcer)" and no token
# could authorize anything. `Env` declares all four required and baseConfig reads all four; none was
# ever set here. Canonical values: packages/contracts/deployments-base-sepolia.json, identical to
# demo-a2a production. A missing address is indistinguishable from a hostile one BY DESIGN (that is
# what fail-closed means), which is why all three of these read as auth failures rather than config.
TIMESTAMP_ENFORCER = "0xBb8fF9c82417189c6EfeBbB369e9dd9d651aa0f3"
ALLOWED_TARGETS_ENFORCER = "0xb06252FaD1D41B9943c73ec696Af70F268581625"
ALLOWED_METHODS_ENFORCER = "0xa076b759D6785bA5E67016e399Af651fC2ABC811"
VALUE_ENFORCER = "0x3D2abD6c7C1319f2bbA96B3b76A7e0d92C620A39"
# RPC_URL intentionally omitted — see apps/demo-a2a/wrangler.toml for
# the rationale. Set as a wrangler secret instead.
CHAIN_ID = "84532"
MCP_AUDIENCE = "urn:mcp:server:person"
# Testnet demo: enable the open /oauth/token demo authorization endpoint (mock
# seed data only). A real production deployment removes this + wires a real AS.
DEMO_OAUTH_MINT_ENABLED = "false"
# Testnet demo: enable on-demand KEK provisioning (the one-click ceremony auto-provisions).
# A real production deployment OMITS this — provisioning is operator-only, out of band.
DEMO_VAULT_PROVISION_ENABLED = "true"
# mcp-provision-unauth-prod: testnet-only skip of the owner-control proof so the live one-click ceremony
# auto-provisions. A real production deployment OMITS this ⇒ proof enforced (ERC-1271 over the challenge).
DEMO_VAULT_PROVISION_SKIP_PROOF = "false"
# spec 287: enable the public native MCP ingress (/mcp/native) with exact-invocation proof.
DEMO_NATIVE_MCP_ENABLED = "true"
# spec 290 §8: per-Smart-Agent hard-budget unit cap enforced on the native path (demo value).
SA_BUDGET_LIMIT_UNITS = "5000"   # must match demo-a2a — one shared budget DO per SA
# spec 288 §6 — edge-mode flag. DEFAULT "false" so an edge-less deploy works (direct /mcp + /mcp/native
# allowed). `deploy-cloudflare.ts` OVERRIDES this to "true" via --var when EDGE_REQUIRED=true, which makes
# both MCP ingress surfaces REQUIRE a valid edge GatewayAssertion (direct → 401; the web routes through the
# edge). Deploy-controlled, NOT baked here — so the one toggle flips the whole flow.
DEMO_REQUIRE_GATEWAY_ASSERTION = "false"

[[env.production.d1_databases]]
binding = "DB"
database_name = "demo-mcp"
database_id = "a7c95b56-8753-47ae-a044-446d5d37cf58"
migrations_dir = "migrations"

# spec 290 §8 — the authoritative per-SA hard-budget store. demo-mcp hosts + enforces it (it is the
# authority point with the verified principal). One DO instance per Smart Agent shard.
[[env.production.durable_objects.bindings]]
name = "SA_BUDGET"
class_name = "SmartAgentBudgetDO"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["SmartAgentBudgetDO"]
