<rect x="72" y="740" width="236" height="196" rx="18" fill="#0b1020" stroke="#3a4670" stroke-width="2"/>
<text x="190" y="786" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#eef1fb">Identity</text>
<text x="190" y="828" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">Smart Agent accounts</text>
<text x="190" y="858" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">names: .me .org .svc</text>
<text x="190" y="888" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">keys that can be replaced</text>
<rect x="328.6666666666667" y="740" width="236" height="196" rx="18" fill="#0b1020" stroke="#3a4670" stroke-width="2"/>
<text x="446.6666666666667" y="786" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#eef1fb">Admission</text>
<text x="446.6666666666667" y="828" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">who is at the door</text>
<text x="446.6666666666667" y="858" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">agent-to-agent transport</text>
<text x="446.6666666666667" y="888" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">budgets</text>
<rect x="585.3333333333334" y="740" width="236" height="196" rx="18" fill="#0b1020" stroke="#3a4670" stroke-width="2"/>
<text x="703.3333333333334" y="786" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#eef1fb">Knowledge</text>
<text x="703.3333333333334" y="828" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">the domain ontology</text>
<text x="703.3333333333334" y="858" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">skills, by commitment</text>
<text x="703.3333333333334" y="888" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">public and private context</text>
<rect x="842" y="740" width="236" height="196" rx="18" fill="#0b1020" stroke="#3a4670" stroke-width="2"/>
<text x="960" y="786" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#eef1fb">Orchestration</text>
<text x="960" y="828" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">intent, plan, act, observe</text>
<text x="960" y="858" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">judge and plan rules</text>
<text x="960" y="888" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">the model gateway</text>
<rect x="1098.6666666666667" y="740" width="236" height="196" rx="18" fill="#0b1020" stroke="#3a4670" stroke-width="2"/>
<text x="1216.6666666666667" y="786" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#eef1fb">Authority</text>
<text x="1216.6666666666667" y="828" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">signed delegations</text>
<text x="1216.6666666666667" y="858" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">limits kept by contracts</text>
<text x="1216.6666666666667" y="888" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">revocable at any time</text>
<rect x="1355.3333333333335" y="740" width="236" height="196" rx="18" fill="#0b1020" stroke="#3a4670" stroke-width="2"/>
<text x="1473.3333333333335" y="786" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#eef1fb">Vault</text>
<text x="1473.3333333333335" y="828" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">the agent's own records</text>
<text x="1473.3333333333335" y="858" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">read only under a grant</text>
<text x="1473.3333333333335" y="888" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">kept by its owner</text>
<rect x="1612" y="740" width="236" height="196" rx="18" fill="#0b1020" stroke="#3a4670" stroke-width="2"/>
<text x="1730" y="786" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#eef1fb">Evidence</text>
<text x="1730" y="828" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">a receipt for each step</text>
<text x="1730" y="858" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">provenance of each run</text>
<text x="1730" y="888" text-anchor="middle" style="font-size:17px;font-weight:400;fill:#9aa5c7">audit events</text>
<text x="72" y="1054" text-anchor="start" style="font-size:20px;font-weight:400;fill:#9aa5c7">Intelligence may be probabilistic. Authority must not be.</text>
<text x="1848" y="1054" text-anchor="end" style="font-size:20px;font-weight:400;fill:#9aa5c7">faithnet.estate/architecture</text>
