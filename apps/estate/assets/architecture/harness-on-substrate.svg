<title id="t">Great Agent Harness requires Agentic Primitives Substrate</title>
<desc id="d">Two layers. On top, the ten steps of the agent harness: Admit, Playbook, Ground, Judge, Plan, Check, Authority, Execute, Receipt, Answer. Beneath, the seven capabilities of the Agentic Primitives substrate: Identity, Admission, Knowledge, Orchestration, Authority, Vault and Evidence. A line joins each step to what it takes from the substrate.</desc>
