<text x="72" y="204" text-anchor="start" style="font-size:22px;font-weight:400;fill:#9aa5c7">The loop is the easy part. What makes it trustworthy is what it stands on.</text>
<text x="72" y="316" text-anchor="start" style="font-size:16px;font-weight:700;fill:#9aa5c7;letter-spacing:.14em">THE HARNESS</text>
