<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 960" width="1460" height="960" role="img" aria-labelledby="t d">
<title id="t">The Scripture ask, answer first</title>
<desc id="d">A question goes through admission to a judge, which names what is gathered: Scripture, general knowledge, or both. The verses that carry the answer are chosen and read from the signed corpus before anything is written; a question that names a verse also reads the study notes and commentaries on it, and a general question reads one encyclopedia article. A model drafts from what was read, and code proves every verse; the draft goes back once if it cites another verse, runs long for its shape, or copies a note. Up to three writings that truly bear on the answer are chosen from the library and sit beside it, and a receipt names the skills used. Intent cards reach the judge through a pinned playbook, and one answer plan reaches the draft from the registry. Scopes and forms are recorded and do not act; age bands are a later option; a people-group skill is reserved and not built.</desc>
