<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 990" width="1460" height="990" role="img" aria-labelledby="t d">
<title id="t">The Scripture ask with a judge first: in testing, not live</title>
<desc id="d">A question goes from the reader through admission to a judge, which picks one of twelve intents or holds. An intent names a scope, which drives planning, gathering and the gate, and a form, which drives the draft. The reader's stated context adds a standpoint and a reader skill to the draft by rule; a people-group skill is reserved and not built. A model drafts, code proves every verse against the signed corpus, the draft is revised once if a check failed, the answer is enriched and it returns with a receipt naming every skill used. Skills reach the judge and the stages from the skills registry through a pinned playbook. If the judge is unsure, no skill applies and the question runs today's path.</desc>
