<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 900" width="1460" height="900" role="img" aria-labelledby="t d">
<title id="t">How the Scripture Agent answers a question: its ask harness, with skills flowing in</title>
<desc id="d">A question goes from the reader through admission and routing. A judge chooses an answer plan or none while the agent gathers what it holds; the plan gates what the writer sees. A model drafts, code proves every quoted verse against the signed corpus, and the draft is revised once if a check failed. The answer is enriched with what the sources say at the cited verses and returned with a receipt. Skills enter from the top: a SKILL.md is published to the skills registry and read when the question arrives; the judge reads each plan's card, the gate applies its writings policy, and the writer reads its body.</desc>
