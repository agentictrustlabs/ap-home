<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 960" width="1460" height="960" role="img" aria-labelledby="t d">
<title id="t">How an ask runs at an agent: the agent harness, with skills flowing in</title>
<desc id="d">An ask goes from the asker through admission, the playbook, grounding, the skill judge, planning and a plan check. Then every step is authorized by a mandate, executed and receipted, and the answer returns. Skills enter from the top: a SKILL.md is published to the skills registry, compiled with the domain ontology into an archetype, and assigned to the agent as its playbook. The judge reads each skill's card; the skill's body is read by its pinned digest when the step runs.</desc>
