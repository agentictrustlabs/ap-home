<text x="40" y="52" class="h">How we measure an answer against what its author wrote</text>
<text x="40" y="78" class="s" text-anchor="start">The gold is the author's own sentences, not what a model remembers. A judge only says whether each sentence was said, and code checks its quote. Links and records are counted by code.</text>
