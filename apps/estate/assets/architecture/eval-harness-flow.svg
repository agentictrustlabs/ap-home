<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 960" width="1460" height="960" role="img" aria-labelledby="t d">
<title id="t">How we measure an answer against what its author wrote</title>
<desc id="d">Published answers (study notes, commentaries, articles and writings before 1000 AD) are the source. The candidate is pinned. Questions are formed from what a note or article answers. The gold is the author's own sentences. Five answerers answer: our original-language record, our English answer, the bare model, Product 1 and Product 2. A judge says, for each author sentence, whether an answer stated it, and code checks the judge's quote; the author's own text and a decoy test the judge first. Links are counted by code. A record test changes a name or number in every record the harness reads and asks which word the answer uses. A report keeps each number apart.</desc>
