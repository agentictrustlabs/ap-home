<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 930" width="1460" height="930" role="img" aria-labelledby="t d">
<title id="t">How we test the Scripture Agent's answers</title>
<desc id="d">Questions are drawn from a large library of articles across every category. Clearly denominational questions are set aside for a later test. A key is built from each article. Each design answers every question. Three checks run apart. Answering: a judge compares two answers blind, in both orders, on one question only, did it answer what was asked, with the article and two other products as contestants. Accuracy: each answer alone, against the article and the verses it cites. Links: a grade for every verse and writing. Planted errors and a noise control test the checks. Confirmed errors are logged, and a scorecard says what to change next.</desc>
