<rect width="1460" height="930" rx="22" fill="#0b1020"/>
<text x="40" y="52" class="h">Logic, ontology and the model: who decides what</text>
<text x="40" y="78" class="s" text-anchor="start">Two projects on one harness: translating the Bible, and answering questions about it. Divide the work by the kind of statement, not by the step.</text>
<rect x="40" y="266" width="545" height="196" rx="18" fill="#111933" stroke="#3a4670" stroke-width="1.5"/>
<text x="58" y="292" class="b" text-anchor="start" style="fill:#3b82f6">BEFORE IT WRITES: DATA AND ONTOLOGY</text>
<g>
<rect x="93" y="318" width="64" height="64" rx="18" fill="#3b82f6"/>
<g transform="translate(108.36,333.36) scale(1.3866666666666667)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.3"/><circle cx="18" cy="7" r="2.3"/><circle cx="12" cy="18" r="2.3"/><path d="M8.2 6.4l7.5.400M7.2 8l3.7 8M16.8 9l-3.7 7"/></g>
<text x="125" y="406" text-anchor="middle" class="n">Facts of the text</text>
<text x="125" y="425" text-anchor="middle" class="s">who speaks, who is</text>
<text x="125" y="441" text-anchor="middle" class="s">meant, every word</text>
</g>
<g>
<rect x="273" y="318" width="64" height="64" rx="18" fill="#3b82f6"/>
<g transform="translate(288.36,333.36) scale(1.3866666666666667)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="6"/><path d="M9.3 10l2 2 3.4-3.8"/><path d="M8.5 15l-1.5 5.5 5-2.5 5 2.5-1.5-5.5"/></g>
<text x="305" y="406" text-anchor="middle" class="n">Our decisions</text>
<text x="305" y="425" text-anchor="middle" class="s">terms, conventions,</text>
<text x="305" y="441" text-anchor="middle" class="s">the standpoint</text>
</g>
<g>
<rect x="453" y="318" width="64" height="64" rx="18" fill="#3b82f6"/>
<g transform="translate(468.36,333.36) scale(1.3866666666666667)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M17.5 12v3.5M20.5 12v2.5"/></g>
<text x="485" y="406" text-anchor="middle" class="n">What it may see</text>
<text x="485" y="425" text-anchor="middle" class="s">no existing Bible,</text>
<text x="485" y="441" text-anchor="middle" class="s">nothing after its time</text>
</g>
<path d="M585 350H671" fill="none" stroke="#8b95b5" stroke-width="2"  marker-end="url(#a)"/>
<g>
<rect x="679" y="304" width="92" height="92" rx="18" fill="#f59e0b"/>
<g transform="translate(701.08,326.08) scale(1.9933333333333334)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l1.9 5.6 5.6 1.9-5.6 1.9L12 18.5l-1.9-5.6L4.5 11l5.6-1.9z"/><path d="M18.5 16.5v3M17 18h3"/></g>
<text x="725" y="420" text-anchor="middle" class="n">The model</text>
<text x="725" y="439" text-anchor="middle" class="s">reads the whole passage</text>
<text x="725" y="455" text-anchor="middle" class="s">and writes it once</text>
</g>
<g>
<rect x="697" y="122" width="56" height="56" rx="16" fill="#111933" stroke="#f59e0b" stroke-width="2.2"/>
<g transform="translate(710.44,135.44) scale(1.2133333333333334)" fill="none" stroke="#f59e0b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 4.5h4v15h-4zM8.5 4.5h4v15h-4z"/><path d="M14.2 6l3.6-1 3 13.5-3.6 1z"/></g>
<text x="725" y="202" text-anchor="middle" class="n"></text>
</g>
<text x="683" y="146" text-anchor="end" class="n">What the model remembers</text>
<text x="683" y="165" text-anchor="end" class="s">its training is its skill, and its bias</text>
<path d="M725 182V296" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#m0)"/>
<circle cx="529" cy="216" r="11" fill="#0b1020" stroke="#ef4444" stroke-width="2"/><text x="529" y="220" text-anchor="middle" class="k">1</text>
<text x="549" y="221" text-anchor="start" class="t">It recites</text>
<text x="711" y="240" text-anchor="end" class="s" style="fill:#ef4444">36% of published verses are close to an existing Bible</text>
<rect x="880" y="266" width="540" height="196" rx="18" fill="#111933" stroke="#3a4670" stroke-width="1.5"/>
<text x="898" y="292" class="b" text-anchor="start" style="fill:#3b82f6">AFTER IT WRITES</text>
<g>
<rect x="938" y="318" width="64" height="64" rx="18" fill="#3b82f6"/>
<g transform="translate(953.36,333.36) scale(1.3866666666666667)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 7.8-7.5 9.5-4.3-1.7-7.5-5-7.5-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g>
<text x="970" y="406" text-anchor="middle" class="n">Checks by code</text>
<text x="970" y="425" text-anchor="middle" class="s">what code can decide</text>
</g>
<g>
<rect x="1118" y="318" width="64" height="64" rx="18" fill="#f59e0b"/>
<g transform="translate(1133.36,333.36) scale(1.3866666666666667)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M7 20h10M5 7h14"/><path d="M5 7l-2.5 6a2.7 2.7 0 0 0 5 0z"/><path d="M19 7l-2.5 6a2.7 2.7 0 0 0 5 0z"/></g>
<text x="1150" y="406" text-anchor="middle" class="n">A judge</text>
<text x="1150" y="425" text-anchor="middle" class="s">another model family,</text>
<text x="1150" y="441" text-anchor="middle" class="s">tested with planted errors</text>
</g>
<g>
<rect x="1298" y="318" width="64" height="64" rx="18" fill="#3b82f6"/>
<g transform="translate(1313.36,333.36) scale(1.3866666666666667)" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-2.4-1.6-2.4 1.6-2.4-1.6-2.4 1.6L6 20.5z"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/></g>
<text x="1330" y="406" text-anchor="middle" class="n">Record</text>
<text x="1330" y="425" text-anchor="middle" class="s">what was decided,</text>
<text x="1330" y="441" text-anchor="middle" class="s">and by what</text>
</g>
