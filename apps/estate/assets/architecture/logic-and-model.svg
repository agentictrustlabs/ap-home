<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 930" width="1460" height="930" role="img" aria-labelledby="t d">
<title id="t">Logic, ontology and the model: who decides what</title>
<desc id="d">A diagram in two parts. Above, one run: before the model writes, data and the ontology fix the facts of the text, our decisions and what the model may see; the model reads the whole passage and writes it once; after it writes, code checks what code can decide, a judge from another model family is tested with planted errors, and the run is recorded. What the model remembers from training feeds both the model and the judge. Three ways it goes wrong are marked: it recites (36% of published verses are close to an existing Bible), it writes to pass the check (verses patched until a check passed had 40 times the error rate), and the judge prefers the familiar (its winner is closer to an existing Bible two times in three). Below, five kinds of statement and who should hold each: what the text is, held as data; what we decided, held in the ontology; how to read and write, left to the model; whether it was done, decided by code; and whether it is good, held well by no one yet. Under each is what happens as models grow: the first and fourth do not change, the second matters more, rules for the third expire, and the fifth is the weakest part.</desc>
