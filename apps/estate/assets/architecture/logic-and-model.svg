<circle cx="826" cy="365" r="11" fill="#0b1020" stroke="#ef4444" stroke-width="2"/><text x="826" y="369" text-anchor="middle" class="k">2</text>
<circle cx="742" cy="492" r="11" fill="#0b1020" stroke="#ef4444" stroke-width="2"/><text x="742" y="496" text-anchor="middle" class="k">2</text>
<text x="762" y="497" text-anchor="start" class="t">It writes to pass the check</text>
<text x="730" y="516" text-anchor="start" class="s" style="fill:#ef4444">verses patched until a check passed had 40 times the error rate</text>
<path d="M757 150H1150V292" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#m0)"/>
<circle cx="1174" cy="176" r="11" fill="#0b1020" stroke="#ef4444" stroke-width="2"/><text x="1174" y="180" text-anchor="middle" class="k">3</text>
<text x="1194" y="181" text-anchor="start" class="t">The judge prefers the familiar</text>
<text x="1164" y="200" text-anchor="start" class="s" style="fill:#ef4444">its winner is closer to an existing</text>
<text x="1164" y="216" text-anchor="start" class="s" style="fill:#ef4444">Bible two times in three</text>
<text x="40" y="578" class="b" text-anchor="start">FIVE KINDS OF STATEMENT, AND WHO SHOULD HOLD EACH</text>
<rect x="40" y="600" width="264" height="176" rx="14" fill="#111933" stroke="#3b82f6" stroke-width="2"/>
<text x="172" y="634" text-anchor="middle" class="n">What the text is</text>
<text x="172" y="658" text-anchor="middle" class="t" style="fill:#3b82f6">Held as data</text>
<text x="172" y="686" text-anchor="middle" class="s">source words, speakers,</text>
<text x="172" y="703" text-anchor="middle" class="s">people, places, dates</text>
<path d="M64 722H280" stroke="#3a4670" stroke-width="1"/>
<text x="172" y="744" text-anchor="middle" class="s">as models grow</text>
<text x="172" y="762" text-anchor="middle" class="t">does not change</text>
<rect x="319" y="600" width="264" height="176" rx="14" fill="#111933" stroke="#3b82f6" stroke-width="2"/>
<text x="451" y="634" text-anchor="middle" class="n">What we decided</text>
<text x="451" y="658" text-anchor="middle" class="t" style="fill:#3b82f6">Held in the ontology</text>
<text x="451" y="686" text-anchor="middle" class="s">terms, conventions, canon,</text>
<text x="451" y="703" text-anchor="middle" class="s">whose standpoint answers</text>
<path d="M343 722H559" stroke="#3a4670" stroke-width="1"/>
<text x="451" y="744" text-anchor="middle" class="s">as models grow</text>
<text x="451" y="762" text-anchor="middle" class="t">matters more</text>
<rect x="598" y="600" width="264" height="176" rx="14" fill="#111933" stroke="#f59e0b" stroke-width="2"/>
<text x="730" y="634" text-anchor="middle" class="n">How to read and write</text>
<text x="730" y="658" text-anchor="middle" class="t" style="fill:#f59e0b">Left to the model</text>
<text x="730" y="686" text-anchor="middle" class="s">grammar, sense, flow,</text>
<text x="730" y="703" text-anchor="middle" class="s">the shape of an answer</text>
<path d="M622 722H838" stroke="#3a4670" stroke-width="1"/>
<text x="730" y="744" text-anchor="middle" class="s">as models grow</text>
<text x="730" y="762" text-anchor="middle" class="t">rules for it expire</text>
<rect x="877" y="600" width="264" height="176" rx="14" fill="#111933" stroke="#3b82f6" stroke-width="2"/>
<text x="1009" y="634" text-anchor="middle" class="n">Was it done?</text>
<text x="1009" y="658" text-anchor="middle" class="t" style="fill:#3b82f6">Decided by code</text>
<text x="1009" y="686" text-anchor="middle" class="s">cited, aligned, in range,</text>
<text x="1009" y="703" text-anchor="middle" class="s">a quotation mark closed</text>
<path d="M901 722H1117" stroke="#3a4670" stroke-width="1"/>
<text x="1009" y="744" text-anchor="middle" class="s">as models grow</text>
<text x="1009" y="762" text-anchor="middle" class="t">does not change</text>
<rect x="1156" y="600" width="264" height="176" rx="14" fill="#111933" stroke="#ef4444" stroke-width="2"/>
<text x="1288" y="634" text-anchor="middle" class="n">Is it good?</text>
<text x="1288" y="658" text-anchor="middle" class="t" style="fill:#ef4444">Held well by no one yet</text>
<text x="1288" y="686" text-anchor="middle" class="s">a model's taste, tested;</text>
<text x="1288" y="703" text-anchor="middle" class="s">a person, for a sample</text>
<path d="M1180 722H1396" stroke="#3a4670" stroke-width="1"/>
<text x="1288" y="744" text-anchor="middle" class="s">as models grow</text>
<text x="1288" y="762" text-anchor="middle" class="t">the weakest part</text>
<rect x="40" y="809" width="22" height="14" rx="4" fill="#3b82f6"/><text x="72" y="821" class="s" text-anchor="start">held outside the model</text>
<rect x="270" y="809" width="22" height="14" rx="4" fill="#f59e0b"/><text x="302" y="821" class="s" text-anchor="start">a model</text>
<path d="M400 816h44" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 6"/><text x="456" y="821" class="s" text-anchor="start">a way it goes wrong, as measured here</text>
<text x="40" y="860" text-anchor="start" class="s">A rule that teaches the model its craft expires with the next model. A rule that states a fact, a decision or a permission does not.</text>
<text x="1420" y="904" class="s" text-anchor="end">faithnet.estate/architecture</text>
</svg>
