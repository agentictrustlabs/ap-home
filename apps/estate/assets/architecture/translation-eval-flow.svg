<rect x="1196" y="128" width="224" height="48" rx="12" fill="#111933" stroke="#f472b6" stroke-width="2"/>
<text x="1308" y="148" text-anchor="middle" class="t">Criteria written first</text><text x="1308" y="165" text-anchor="middle" class="s">before any draft is made</text>
<path d="M1370 176V256" fill="none" stroke="#f472b6" stroke-width="2"  marker-end="url(#as)"/>
