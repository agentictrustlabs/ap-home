<text x="40" y="970" text-anchor="start" class="s">A typical comparison reads 180 to 320 verses. That is small, and it is why a gain must be clear of the difference between two identical runs before it counts.</text>
<text x="1420" y="1014" class="s" text-anchor="end">faithnet.estate/architecture</text>
