<text x="40" y="52" class="h">How we test the quality of a translation</text>
<text x="40" y="78" class="s" text-anchor="start">No person reviews RBS, so every change to the harness has to prove itself on locked passages, against a second run of the unchanged plan, read blind by another model family.</text>
<text x="40" y="112" class="b" text-anchor="start" style="fill:#f472b6">WHAT KEEPS THE TEST HONEST</text>
