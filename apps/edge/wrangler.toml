# Agentic Edge admission Worker (spec 288 §6).
#
# Deploy: wrangler deploy --env production
#
# The edge is the public ingress; it runs admission (edge-runtime + edge-cloudflare) and dispatches
# admitted bytes to demo-mcp / demo-a2a over Service Bindings. It owns NO authority (ADR-0043) — the
# downstream Workers still run the full Web3 pipeline.
#
# Route lockdown (making demo-a2a/demo-mcp private) is sequenced LAST and gated on a caller-migration
# checklist (spec 288 §6) — NOT done here; the downstream Workers keep their current public exposure
# until every caller is repointed at the edge.

name = "demo-edge"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

# ──────────────────────────────────────────────────────────────────────────
# Local development (top-level = the default env used by `wrangler dev`).
#
# `scripts/dev.sh` runs demo-a2a (:8787), demo-mcp (:8788) and this edge (:8789) as sibling
# `wrangler dev` sessions; the Service Bindings below resolve through wrangler's local dev registry
# to the Workers NAMED demo-mcp / demo-a2a (their top-level `name`). Non-secret local values
# (chain, contracts, origins) come from apps/edge/.dev.vars written by scripts/gen-dev-vars.ts.
# Production keeps its own block under [env.production] — nothing here is inherited by it.
# ──────────────────────────────────────────────────────────────────────────
[[services]]
binding = "MCP"
service = "demo-mcp"

[[services]]
binding = "A2A"
service = "demo-a2a"

[[durable_objects.bindings]]
name = "SA_BUDGET"
class_name = "SmartAgentBudgetDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SmartAgentBudgetDO"]

[[ratelimits]]
name = "EDGE_LIMITER"
namespace_id = "2881"
simple = { limit = 120, period = 60 }

[dev]
port = 8789
local_protocol = "http"

[env.faithnet]
name = "demo-edge-faithnet"
workers_dev = true

[[env.faithnet.routes]]
pattern = "edge.faithnet.io"
custom_domain = true

[env.faithnet.vars]
CHAIN_ID = "34348"
ENTRY_POINT = "0xf7855250B3363AB7649B10957d8908A9AFcdD4B5"
DELEGATION_MANAGER = "0x710cb1bF08C234Df397e0910331e0A29710EF4F7"
UNIVERSAL_SIGNATURE_VALIDATOR = "0xeDd56f500325D4701B9985A34e5Fa6EED6716137"
SA_BUDGET_LIMIT_UNITS = "10"
EDGE_ALLOWED_ORIGINS = "https://faithnet.me,https://www.faithnet.me,https://gather27-web-faithnet.richardpedersen3.workers.dev,https://gather27-web-churchglobal.richardpedersen3.workers.dev,http://localhost:5175"

[[env.faithnet.durable_objects.bindings]]
name = "SA_BUDGET"
class_name = "SmartAgentBudgetDO"

[[env.faithnet.migrations]]
tag = "v1"
new_sqlite_classes = ["SmartAgentBudgetDO"]

[[env.faithnet.ratelimits]]
name = "EDGE_LIMITER"
namespace_id = "2882"
simple = { limit = 120, period = 60 }

[[env.faithnet.services]]
binding = "MCP"
service = "demo-mcp-faithnet"

[[env.faithnet.services]]
binding = "A2A"
service = "demo-a2a-faithnet"
