# Agentic Edge admission Worker (spec 288 §6).
#
# Deploy: wrangler deploy --env production
#
# The edge is the public ingress; it runs admission (edge-runtime + edge-cloudflare) and dispatches
# admitted bytes to home-vault / home-runtime over Service Bindings. It owns NO authority (ADR-0043) — the
# downstream Workers still run the full Web3 pipeline.
#
# Route lockdown (making home-runtime/home-vault private) is sequenced LAST and gated on a caller-migration
# checklist (spec 288 §6) — NOT done here; the downstream Workers keep their current public exposure
# until every caller is repointed at the edge.

name = "home-edge"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

# ──────────────────────────────────────────────────────────────────────────
# Local development (top-level = the default env used by `wrangler dev`).
#
# `scripts/dev.sh` runs home-runtime (:8787), home-vault (:8788) and this edge (:8789) as sibling
# `wrangler dev` sessions; the Service Bindings below resolve through wrangler's local dev registry
# to the Workers NAMED home-vault / home-runtime (their top-level `name`). Non-secret local values
# (chain, contracts, origins) come from apps/edge/.dev.vars written by scripts/gen-dev-vars.ts.
# Production keeps its own block under [env.production] — nothing here is inherited by it.
# ──────────────────────────────────────────────────────────────────────────
[[services]]
binding = "MCP"
service = "home-vault"

[[services]]
binding = "A2A"
service = "home-runtime"

[[durable_objects.bindings]]
name = "SA_BUDGET"
class_name = "SmartAgentBudgetDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SmartAgentBudgetDO"]

[[ratelimits]]
name = "EDGE_LIMITER"
namespace_id = "2881"
simple = { limit = 120, period = 60 }

[dev]
port = 8789
local_protocol = "http"

# ── THIS ESTATE — Home on faithchain (chain 34348), `[env.production]`. Derived from Ring 0's [env.faithnet]
#    by scripts/split/derive-ap-home-env.py (ap-home-estate.json) at extraction; hand-maintained after the cut.
#    Worker `home-edge` at https://home-edge.faithnet.io — its own DOs, KV and D1; the Home at https://home-rho-orpin.vercel.app.
#    This is NOT Faithnet: Faithnet is Ring 0's deployment of the same app and is never deployed from here.
[env.production]
name = "home-edge"
workers_dev = false
[env.production.vars]
CHAIN_ID = "34348"
ENTRY_POINT = "0xf7855250B3363AB7649B10957d8908A9AFcdD4B5"
DELEGATION_MANAGER = "0x710cb1bF08C234Df397e0910331e0A29710EF4F7"
UNIVERSAL_SIGNATURE_VALIDATOR = "0xeDd56f500325D4701B9985A34e5Fa6EED6716137"
SA_BUDGET_LIMIT_UNITS = "10"
EDGE_ALLOWED_ORIGINS = "http://localhost:5175,https://home-rho-orpin.vercel.app"

[[env.production.durable_objects.bindings]]
name = "SA_BUDGET"
class_name = "SmartAgentBudgetDO"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["SmartAgentBudgetDO"]

[[env.production.ratelimits]]
name = "EDGE_LIMITER"
namespace_id = "2882"
simple = { limit = 120, period = 60 }

[[env.production.services]]
binding = "MCP"
service = "home-vault"

[[env.production.services]]
binding = "A2A"
service = "home-runtime"


[[env.production.routes]]
pattern = "home-edge.faithnet.io"
custom_domain = true
