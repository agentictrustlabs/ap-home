# Haiku, one component changed). Gemini is first and unmetered, so every call that names no provider still goes to Gemini;
# Anthropic carries only a turn that names it. (Until today the structured call fell through to Claude whatever the route
# said — every judgment and skill.apply call ran on Haiku while this line read "gemini"; context-wiring now refuses that.)
ORCHESTRATION_LLM = "gemini,anthropic"
# Spec 416 §4f — the fast judge picks among a playbook's instruction skills before the planner (one light-model call over
# ontology cards + the typed reading; "none" hands the ask to the planner). Only agents with instruction skills are affected.
SKILL_SELECTION_DEFAULT = "selective"
# Spec 416 §4h — the asker's own recent skills here (+ memory at their own agent) in the reading on REAL asks (ledger: +11/−0, p = 0.001).
SKILL_SELECTION_ASKER_CONTEXT = "full"
# Spec 418 §11 — the plan around the pick: one choice among the plans the ontology allows (ledger: chain panel 4 +12/−0).
SKILL_SELECTION_PLAN = "choice"
