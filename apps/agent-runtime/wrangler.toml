# Cloudflare Worker config for demo-a2a.
#
# Local dev:  wrangler dev (reads .dev.vars for secrets + Anvil contract addrs)
# Production: wrangler deploy (uses [vars] + secrets set via `wrangler secret put`)
#
# Durable Object SESSIONS holds the SessionStore (one global instance for the
# demo; production would shard per-user via idFromName(walletAddress)).
#
# nodejs_compat is on so our @agenticprimitives/* packages can keep using
# `process.env`, `Buffer`, and the Web-Crypto interfaces they already use.

name = "demo-a2a"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787
local_protocol = "http"

[durable_objects]
bindings = [
  { name = "SESSIONS", class_name = "SessionStoreDO" },
  { name = "A2A_TASKS", class_name = "A2aTaskDO" },
  { name = "INTERACTIONS", class_name = "InteractionsDO" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionStoreDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["A2aTaskDO"]

[vars]
RPC_URL = "http://127.0.0.1:8545"
CHAIN_ID = "31337"
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173"
MCP_URL = "http://127.0.0.1:8788"
# spec 329 W2 — discovery reach for find_members in local dev (base-URL transport; production uses
# the DISCOVERY_MCP service binding below). Unreachable ⇒ routing degrades to the un-enriched
# eligible set (fail-open to fewer signals, never to more candidates).
DISCOVERY_MCP_BASE = "http://127.0.0.1:8790"

# Contract addresses + secrets live in .dev.vars (gitignored) for local dev.

# ──────────────────────────────────────────────────────────────────────────
# Production environment — Worker name: "demo-a2a-production"
#
# Deploy via `pnpm deploy:cloudflare` (scripts/deploy-cloudflare.ts), which
# wraps `wrangler deploy --env production` with `--var` flags for contract
# addresses (from deployments-base-sepolia.json) and the just-deployed
# demo-mcp URL.
#
# Secrets are set ONCE per environment via:
#   wrangler secret put SESSION_JWT_SECRETS    --env production
#   wrangler secret put CSRF_SECRET            --env production
#   wrangler secret put A2A_SESSION_SECRET     --env production
#   wrangler secret put A2A_MASTER_PRIVATE_KEY --env production
#   wrangler secret put A2A_MAC_SECRET         --env production   # R7.4 — shared with demo-mcp
#
# A2A_MAC_SECRET is the HMAC key that binds the a2a→mcp service envelope
# (audience + service + route + nonce + timestamp + body digest). demo-mcp
# rejects every call when this is unset on the producer side. The SAME
# value must be set on demo-mcp via the same `wrangler secret put` command.
# The preflight (scripts/check-production-deploy.ts N10.1) refuses deploys
# when this declaration is absent.
#
# Non-inheritable keys (vars, durable_objects, kv, d1, etc.) must be
# re-declared per environment — that's why this block repeats the DO binding.
# ──────────────────────────────────────────────────────────────────────────

[env.production]
# A2A-by-subdomain (spec 231): bind EVERY <handle>.impact-agent.io to this Worker
# so it serves that agent's A2A endpoint directly (host-context reads the Host —
# no passthrough). Apex impact-agent.io stays on the demo-sso project (its own
# DNS record). Requires a proxied `*.impact-agent.io` DNS record in the zone.
routes = [
  { pattern = "*.impact-agent.io/*", zone_name = "impact-agent.io" }
]
# KEEP the workers.dev URL alive alongside the route — demo-sso's /a2a proxy +
# demo-web*/demo-mcp all call this Worker via DEMO_A2A_URL/MCP_URL
# (https://demo-a2a-production.<acct>.workers.dev). Declaring a route flips the
# workers_dev default to false, so we set it back to true explicitly.
workers_dev = true

[env.production.vars]
# RPC_URL intentionally omitted — set as a secret instead so the value
# (which may embed an API key for a paid RPC provider like Alchemy /
# Infura) doesn't end up in the tracked wrangler.toml. Configure with:
#   echo "<rpc-url>" | wrangler secret put RPC_URL --env production
CHAIN_ID = "84532"
# ADR-0044 / spec 327 — the Ring-0 orchestration loop plans with the Anthropic LLM planner when BOTH
# this mode flag AND the ANTHROPIC_API_KEY secret are present (selectPlanner requires both — with the
# secret absent the deterministic rule-based planner runs, a config choice, not a fallback). Committed
# here (not a --var) so it survives targeted deploys. Key: `wrangler secret put ANTHROPIC_API_KEY
# --env production`. Optional ORCHESTRATION_MODEL overrides the planner default model.
ORCHESTRATION_LLM = "anthropic"
# spec 334 §6 gather phase — OPTIONAL public reference-graph endpoint. Left UNSET here on purpose:
# the coordination agent's gather phase is inert until this is configured, so enabling it (and thereby
# pointing the platform at a specific public graph) is a deliberate deploy choice, not a default. To
# enable: set PUBLIC_GRAPH_URL to a read-only SPARQL endpoint and, if it needs one, the Basic credential
#   wrangler secret put PUBLIC_GRAPH_BASIC --env production
# The tool is domain-agnostic (SELECT/ASK only, mutation/SERVICE refused, timeout + row cap enforced in
# public-graph.ts); the QUERY is authored by the model from the org's playbook, so no ontology lives here.
# gc-public: the same public people-group C-box repo uupg reads (GRAPHDB_QUERY_URL). Requires the Basic
# credential — set PUBLIC_GRAPH_BASIC as a secret (the same value as uupg's GRAPHDB_BASIC).
PUBLIC_GRAPH_URL = "https://graphdb.agentkg.io/repositories/gc-public"
# skill-provenance/v1 — OPTIONAL skills-corpus base URL. Left UNSET on purpose: artifact
# provenance tagging is inert until configured, so enabling it is a deliberate deploy choice.
# To enable: point at a deployed @skills/skill-corpus and publish the matching canonical ids
# (skill:public/orchestrate, skill:public/discussion-consult). Handlers then attach a verifiable
# skill-provenance manifest to their Artifact.metadata; fail-open (a corpus error never blocks
# the artifact). See src/skill-provenance.ts.
SKILLS_CORPUS_URL = "https://skills-a2a-production.richardpedersen3.workers.dev"
# CRIT-2 (audit 2026-07-13) — server-mint RETIRED: DEMO_ALLOW_SERVER_MINT is removed entirely (the
# callMcpToolViaDelegation path is deleted). Every vault path client-mints — interactions/messaging via
# the DEL-001 session leaf (NEW-C1 + spec 323 W3.2), Act6 via native invocation proof, the A2aTaskDO seams +
# /mcp/vault/* + /intent + /mcp/person|org via DO-side invocation proof (callMcpToolWithProof). The
# interactions-do fail-closes (409) if the interactions-session key is unprovisioned. No server-mint knob.
# spec 290 §8 — per-SA hard-budget unit cap for the A2A task path. MUST match demo-mcp's value (same
# shared DO authority per SA across both paths).
SA_BUDGET_LIMIT_UNITS = "25"
# spec 288 §6 — edge-mode flag. Production runs EDGE-REQUIRED: both A2A task ingress shapes REQUIRE a valid
# edge GatewayAssertion — the agent-addressed edge path `POST /api/a2a/<handle>` (the edge conveys the agent
# in the signed assertion `path`; demo-a2a resolves it via resolveAgentByLabel) works, while the bare
# subdomain-direct path 401s (intentional — forces traffic through the edge). The agent-card then advertises
# the edge endpoint (DEMO_EDGE_URL). Relayer verbs (/session/*, /account/*) are never gated. Committed "true"
# as the production BASELINE (INCIDENT 2026-07-19): a plain `wrangler deploy` must not silently drop this to
# the edge-less default. `deploy-cloudflare.ts` still passes String(EDGE_REQUIRED) via --var, so an
# intentional edge-less deploy (EDGE_DISABLED=true) still overrides to "false".
DEMO_REQUIRE_GATEWAY_ASSERTION = "true"
# INCIDENT 2026-07-19 — these were empty placeholders overridden ONLY by `pnpm deploy:cloudflare`'s --var
# flags. A hand-run `wrangler deploy --env production --var <subset>` (or a plain deploy) reverted them to ""
# → ALLOWED_ORIGINS="" made verifyCsrf reject EVERY mutating request ("csrf invalid": portal rebuild, Home
# name-claim, /a2a/custody/* 403s), and MCP_URL="" broke entitled reads. Now committed with the canonical
# production values as a fail-safe BASELINE so a plain deploy can never drop them again. deploy-cloudflare.ts
# still re-injects the same values via --var (from deployments-<network>.json + the Pages URLs), so a real
# deploy stays authoritative for address/URL rotation; these committed values only backstop targeted deploys.
ALLOWED_ORIGINS = "https://agenticprimitives-demo.pages.dev,https://agenticprimitives-demo-pro.pages.dev,https://agenticprimitives-demo-recovery.pages.dev,https://agenticprimitives-demo-org.pages.dev,https://agenticprimitives-demo-jp.pages.dev,https://agenticprimitives-demo-gs.pages.dev,https://demo-bible-ontology-production.richardpedersen3.workers.dev,https://impact-agent.io,https://*.impact-agent.io,https://impact-agent.me,https://*.impact-agent.me,https://churchcore.me,https://*.churchcore.me"
MCP_URL = "https://demo-mcp-production.richardpedersen3.workers.dev"
# Signer backend selection. EXPLICIT default — there is NO silent fallback
# inside @agenticprimitives/key-custody (ADR-0013 / feedback_no_silent_fallbacks),
# so an empty string here means "misconfigured" and the topup / relayer /
# custody routes WILL throw `[key-custody] No backend specified for production`
# at first signing op. `local-aes` is the testnet default (reads the
# A2A_MASTER_PRIVATE_KEY secret); production stacks override per-deploy with
#   A2A_KMS_BACKEND=gcp-kms GCP_KMS_KEY_NAME=projects/... pnpm deploy:cloudflare
# (the deploy script passes both via --var; GCP_SERVICE_ACCOUNT_JSON is set
# via `wrangler secret put`). INCIDENT 2026-07-19 — GCP_KMS_KEY_NAME committed
# with its canonical value (a non-secret KMS RESOURCE PATH — the private key
# never leaves Cloud KMS) so a plain deploy keeps the relayer/custody signer
# wired instead of throwing "[key-custody] No backend specified".
A2A_KMS_BACKEND = "gcp-kms"
GCP_KMS_KEY_NAME = "projects/churchcore2/locations/us-east1/keyRings/a2a/cryptoKeys/relay/cryptoKeyVersions/1"
# A2A_ALLOW_LOCAL_MASTER_KEY: opt-in for the dev-only LocalSecp256k1Signer
# (which loads A2A_MASTER_PRIVATE_KEY into worker memory) to run in
# NODE_ENV=production. Required for the demo because esbuild's --define
# bakes NODE_ENV='production' at build time, so the runtime guard fires
# unconditionally without this opt-in. Production stacks with real-value
# keys MUST replace this with A2A_KMS_BACKEND=gcp-kms before this flag
# is removed. The signer logs a loud one-time warning when this flag is in
# use. See packages/key-custody/AUDIT.md → KC-3.
A2A_ALLOW_LOCAL_MASTER_KEY = "true"
# A2A_ALLOW_LOCAL_ENVELOPE_KEY: opt-in for LocalAesProvider's HKDF-AES
# session-data-key wrap/unwrap (the envelope crypto under
# delegation.SessionManager). Same shape as A2A_ALLOW_LOCAL_MASTER_KEY
# but a stricter threat model: compromise of the wrangler-secret
# master = decrypt every session keypair at rest = forge delegations.
# Acceptable for the demo (test keys, ephemeral DOs); MUST be replaced
# by A2A_KMS_BACKEND=gcp-kms + GCP_KMS_ENCRYPT_KEY_NAME before any
# real-value keys land. See packages/key-custody/AUDIT.md → KC-3.
A2A_ALLOW_LOCAL_ENVELOPE_KEY = "false"
# GCP_KMS_ENCRYPT_KEY_NAME: full resource name of the symmetric Cloud KMS
# key used by GcpKmsProvider for session-data-key envelope encryption.
# When set (alongside A2A_KMS_BACKEND=gcp-kms), demo-a2a uses Cloud KMS
# Encrypt/Decrypt for envelope wrapping instead of LocalAesProvider's
# HKDF-from-local-secret path. Required for live (production) deploys
# because LocalAesProvider fails closed when NODE_ENV=production.
# INCIDENT 2026-07-19 — committed canonical (non-secret KMS resource path).
GCP_KMS_ENCRYPT_KEY_NAME = "projects/churchcore2/locations/us-east1/keyRings/a2a/cryptoKeys/envelope/cryptoKeyVersions/1"
# NEW-C1 — the interactions-session signing key (DEL-001 client-mint bound
# vault tokens). Committed canonical (non-secret KMS resource path).
GCP_KMS_INTERACTIONS_KEY_NAME = "projects/churchcore2/locations/us-east1/keyRings/a2a/cryptoKeys/interactions-session/cryptoKeyVersions/1"
# PAYMASTER: SmartAgentPaymaster contract address. When set, demo-a2a
# enables the /session/deploy endpoints; demo-web shows the Step 1.5
# "Deploy smart account" prompt and the user's smart account is deployed
# via a paymaster-sponsored UserOp on first SIWE login. When empty,
# /session/deploy returns 409 and the demo falls back to counterfactual
# mode (requireDeployed:false in demo-mcp). INCIDENT 2026-07-19 — committed
# canonical (from deployments-base-sepolia.json) so /session/deploy stays
# enabled after a plain deploy; deploy-cloudflare.ts still overrides via --var.
PAYMASTER = "0x3444160e79C463B8F1e10f86Eae4047E22256aD0"
# PAYMASTER_VERIFYING_SIGNER: address that demo-a2a must sign paymaster
# envelopes for. MUST match SmartAgentPaymaster.verifyingSigner() on-chain;
# /session/deploy appends a 77-byte verifying-paymaster signature using
# the master KMS account when this is set. When unset, paymasterAndData
# is built without a signature (acceptable only if paymaster is in
# allowlist/dev mode). Realigned on-chain 2026-05-20 to the demo-a2a
# master signer's address; tracked under audit C2.
PAYMASTER_VERIFYING_SIGNER = "0x89D13c596c45E4eE80Af5ae06C727FE9A820ffD0"
# UNIVERSAL_SIGNATURE_VALIDATOR: address of the on-chain ECDSA/ERC-1271/
# ERC-6492 verifier deployed by Deploy.s.sol. When set, /auth/siwe-verify
# uses the validator (required for the passkey path — spec 130). When
# unset, falls back to legacy ECDSA-only recovery (EOA flow only).
# Injected via --var at deploy time by scripts/deploy-cloudflare.ts.
# INCIDENT 2026-07-19 — committed canonical so a plain deploy keeps the
# passkey/ERC-6492 SIWE path working.
UNIVERSAL_SIGNATURE_VALIDATOR = "0x3bc65655d4b6fb57731A256fcd47Db2F8Fe36907"

# ──────────────────────────────────────────────────────────────────────────
# INCIDENT 2026-07-19 — production BASELINE for the remaining deploy-injected
# vars. Previously these existed ONLY as `--var` flags in
# scripts/deploy-cloudflare.ts (built from deployments-<network>.json + fixed
# constants). A plain `wrangler deploy --env production` — or a targeted
# `--var <subset>` hotfix — carried NONE of them, wiping ALLOWED_ORIGINS, the
# contract addresses, the broker/custody config, etc. to their empty toml
# defaults. That is what broke the live Home + custody + portal rebuild
# ("csrf invalid" everywhere ALLOWED_ORIGINS was empty). Committing them here
# makes that class of failure impossible: the sanctioned deploy still
# re-injects the same values via --var (authoritative for rotation), while any
# other deploy path inherits a WORKING production config instead of blanks.
#
# Contract addresses — mirror packages/contracts/deployments-base-sepolia.json.
# deploy-cloudflare.ts overrides these from the JSON on a real deploy, so a
# contract redeploy still rotates them; these are only the safe fallback.
ENTRY_POINT = "0x96E37dD695840AF7781E669bdca9d79E4d7d8040"
DELEGATION_MANAGER = "0x9eD1dC0FD2284fcd4967beeF3317129fee7a92e5"
AGENT_ACCOUNT_FACTORY = "0xA9B6e53FcD8DA3658DeD09f4e37b22baA25De715"
TIMESTAMP_ENFORCER = "0xBb8fF9c82417189c6EfeBbB369e9dd9d651aa0f3"
ALLOWED_TARGETS_ENFORCER = "0xb06252FaD1D41B9943c73ec696Af70F268581625"
ALLOWED_METHODS_ENFORCER = "0xa076b759D6785bA5E67016e399Af651fC2ABC811"
VALUE_ENFORCER = "0x3D2abD6c7C1319f2bbA96B3b76A7e0d92C620A39"
CUSTODY_POLICY = "0x5DB542eeBa652372afE6B4b0Cd40D999e65846de"
QUORUM_ENFORCER = "0xA4b148EfF1Ff1c116849F6e9D9c0059bC644873F"
APPROVED_HASH_REGISTRY = "0x465f8DCE65aB51A1562CC60E6bc046ca8734D537"
AGENT_NAME_REGISTRY = "0x6629Cca40B008C0984a1Ca266Ca10A344420cac3"
AGENT_NAME_UNIVERSAL_RESOLVER = "0xB890060dE1B3Fd2C78e1f0859da3883743eAD452"
PROFILE_RESOLVER = "0xfcd37F8dca26ead889922b22C169c21370bd352a"
PERMISSIONLESS_SUBREGISTRY = "0x598C7bbAf25f5246BE3D5A75FdEDC180D67D8026"
AGENT_RELATIONSHIP = "0x0AF2455e3f76594E81d9042aD5FE22A5A35dc57f"
# Personal-subdomain → agent resolution base for the A2A endpoints (spec 231).
A2A_PUBLIC_BASE_DOMAIN = "impact-agent.io"
# Agentic Edge admission Worker (advertised on the agent-card in edge mode).
DEMO_EDGE_URL = "https://demo-edge-production.richardpedersen3.workers.dev"
# Google × KMS custody (spec 235): the broker `iss` + JWKS the custody gate
# verifies social sessions against, and the broker-token audience.
BROKER_ISS = "https://www.impact-agent.me"
BROKER_JWKS_URL = "https://www.impact-agent.me/jwks"
DEMO_SSO_AUD = "demo-sso"
# NEW-H6 — the pinned interactions grant delegate (interactions-do.ts).
INTERACTIONS_SERVICE_SA = "0x39508624387fed3b9d6dd15ba86d3ace8a3f0a6a"

[env.production.durable_objects]
bindings = [
  { name = "SESSIONS", class_name = "SessionStoreDO" },
  { name = "A2A_TASKS", class_name = "A2aTaskDO" },
  { name = "INTERACTIONS", class_name = "InteractionsDO" },
  # spec 290 §8/§9 — CROSS-SCRIPT binding to demo-mcp's SmartAgentBudgetDO so the A2A + MCP paths share
  # ONE hard-budget authority per Smart Agent. demo-mcp owns the class + migration; demo-a2a only binds.
  { name = "SA_BUDGET", class_name = "SmartAgentBudgetDO", script_name = "demo-mcp-production" },
]

# Bridge anti-replay nonce store (audit M-1): single-use bridge-envelope nonces recorded across isolates
# (the per-isolate in-memory Map caught nothing cross-isolate). TTL'd presence keys via `nonceStoreFromKv`.
[[env.production.kv_namespaces]]
binding = "BRIDGE_NONCES"
id = "7580076e201f480aa9dce2ec1294d0cd"

# D-P0-1 (spec 220 / ADR-0011): the durable (iss,sub)->SA map that ACTIVATES the assertSubjectSaStable
# guard. Records each OIDC subject's derived Smart Agent on first resolve; fail-closed 409 custody_root_changed
# if a later resolve derives a DIFFERENT SA (the custody-derivation root A2A_CUSTODY_ROOT_KEY changed) so a
# rotation can never silently orphan the old account + its vault. Empty map = records-on-first-sight (safe).
[[env.production.kv_namespaces]]
binding = "SUBJECT_SA_MAP"
id = "ceb52b3418ae4ac9acde3206b3ec8862"

# Federated user-data tokens (spec 265): per-person YouVersion OAuth access/refresh tokens, KMS-encrypted
# at rest (envelope), keyed by person SA. Read ONLY server-side by the youversion read-proxy — never
# returned to a relying app or grantee.
[[env.production.kv_namespaces]]
binding = "FED_TOKENS"
id = "e050ce20dd6e4a88b568e2f5ed1b47a0"

# Service binding: demo-a2a → demo-mcp. Cloudflare blocks direct
# fetch(*.workers.dev) between sibling Workers on the same account
# with error 1042 (recursion/loop protection). Service bindings are
# the canonical fix — calls flow through Cloudflare's internal
# routing, never touching the public edge.
[[env.production.services]]
binding = "MCP"
service = "demo-mcp-production"

# spec 329 W2 — service binding: demo-a2a → demo-discovery-mcp (same-account Worker, plain name —
# deployed without an env suffix). find_members enriches consult candidates through it (read-only,
# public facets, ADR-0040). COMMITTED here (not a --var) so it survives targeted deploys; discovery
# unreachable at runtime ⇒ routing degrades to the un-enriched eligible set (spec 329 §4).
[[env.production.services]]
binding = "DISCOVERY_MCP"
service = "demo-discovery-mcp"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["InteractionsDO"]
