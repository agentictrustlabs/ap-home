AGENT_NAME_PARENTS = "me"   # was "me,impact" — the `.impact` root was retired 2026-11-10
# Spec 444 W3 — the runtime's ISSUANCE EVIDENCE (an organization issuing its members' credentials): the iss/aud the key
# service's [authority_evidence] pins; the key itself is the secret ISSUANCE_EVIDENCE_ES256_KEY (its JWK is in the CVM's JWKS).
