AGENT_RELATIONSHIP = "0x5015bD7d422e003511246f848cDd798cb00BB968"
# Agents live on their OWN zone (2026-08-30). faithnet.io stays parseable because two cards were already
# published under it and their URLs are inside signed bytes; nothing new publishes there.
A2A_PUBLIC_BASE_DOMAIN = "faithnet.ai,faithnet.io"
