# ══════════════════════════════════════════════════════════════════════════════════════════════════════════
# IMPACT_AGENT — the town's SECOND estate on faithchain (spec 436 §5.5; towns/faithchain/town.yaml).
#
# Shares the chain, the contracts and the town. Its own: custody root, relay key, interactions key, service
# agents, vault, Workers, Home. An impact-agent person is a DIFFERENT Smart Agent from a faithnet person of the
# same name — a KMS-custodied home is a CREATE2 address over a derived custodian, and the roots differ.
#
# No zone of its own (the owner's decision, 2026-10-11), so:
#   · no custom domain and no per-agent host block — every agent answers at the one workers.dev origin;
#   · `A2A_PUBLIC_BASE_DOMAIN` is that origin, and `A2A_SERVES_UNPUBLISHED_NAMES` is true because no impact-agent
#     name publishes an `atl:a2aEndpoint` of its own yet.
#
# Custody and key custody are local-aes, not AKCS: there is no `imb` tenant (it needs a caller token minted
# on the Azure CVM). Those three lines are what changes when the tenant exists — nothing else.
# ══════════════════════════════════════════════════════════════════════════════════════════════════════════
[env.impact-agent]
name = "imb-runtime"
workers_dev = true

# ── REAL DNS FOR THIS ESTATE (2026-10-13) ─────────────────────────────────────────────────────────────
# impact-agent was stood up on `workers.dev` and `imb-home.vercel.app` (`docs/runbooks/new-estate.md` §0: "A zone
# of its own? no"), and the runbook named the cost: without a wildcard zone there are no per-agent card
# hosts. It now has the owner's own zones — `impact-agent.io` + `impact-agent.ai` on Cloudflare,
# `impact-agent.me` on Vercel — in the same shape as faithnet (`.io` for service hosts, `.ai` wildcard for
# per-agent cards, `.me` for the Home).
#
# ADDITIVE ON PURPOSE. `workers_dev` stays on and the old host stays LAST in `A2A_PUBLIC_BASE_DOMAIN`: the
# list is "most-canonical FIRST" and `resolveAgentHost` parses a hostname against EVERY zone it serves,
# because an agent card's URL is inside its SIGNED bytes and cannot be edited in place. Drop the old zone
# and every card published before today stops naming its agent.
[[env.impact-agent.routes]]
pattern = "a2a.impact-agent.io"
custom_domain = true

# THE PER-AGENT CARD HOSTS. One wildcard covers every agent (ADR-0061: one label, `<label>-<type>.<zone>`),
# so no agent needs a custom domain of its own. A `zone_name` route does NOT create DNS — the zone needs a
# PROXIED `*` record, which `*.faithnet.ai` has and is what makes that zone work.
[[env.impact-agent.routes]]
pattern = "*.impact-agent.ai/*"
zone_name = "impact-agent.ai"


[env.impact-agent.ai]
binding = "AI"

[env.impact-agent.vars]
AKCS_RELAY_KEY_ID = "01a13c7d-c613-78d2-97ba-483497f7a04b"               # spec 441 D3 — imb-relay, SIGNING/secp256k1 in the imb tenant, created 2026-10-14
AKCS_INTERACTIONS_KEY_ID = "01a13c7d-c866-7c51-b56c-a933f5a563c3"        # spec 441 D3 — imb-interactions-session, same tenant; replaces A2A_INTERACTIONS_SESSION_PRIVATE_KEY
FEDERATION_DOORS = '{"ap-federation-door:impact-agent":"https://door.ap-federation.faithnet.io","ap-federation-door:faithnet":"https://door-faithnet.ap-federation.faithnet.io"}'  # spec 439 F3 — the federation doors whose receipts this estate reads (custom domains only)
