# Spec 400 W1c — the runtime member's Container: Node + `ap runtime serve` + the ACP agent, next to the Worker.
# Image built by wrangler from ./runtime-container (run `node runtime-container/build.mjs` first — it packs the kit
# into ./runtime-container/tarballs). Per-member secrets: AP_RUNTIME_RECORD_<NAME> / AP_RUNTIME_KEY_<NAME>
# (`ap runtime export`); AP_RUNTIME_AGENT picks the agent (acp-stub-agent | claude-code-acp).
[[env.faithnet.containers]]
class_name = "RuntimeContainer"
image = "./runtime-container/Dockerfile"
max_instances = 3
instance_type = "basic"

# Private-scripture W4 — the holder's prover: the 1k proving + verifying keys (≈560 MB) and the Prepare pool (≈45 MB each).
# Image built by wrangler from ../holder-prover (copy ~/.cache/openac-5.0.0/1k_*.key into ../holder-prover/keys first).
# Secrets beside the Worker's: PROVER_SECRET (its bearer); it reuses AKCS_HOLDER_TOKEN and the issuance-evidence key.
[[env.faithnet.containers]]
class_name = "HolderProverContainer"
image = "../holder-prover/Dockerfile"
max_instances = 1
# Show peaks at ≈3.7 GB (measured, openac-sdk 5.0.0, 1k): `standard` (4 GiB) was killed mid-proof. Show is CPU-bound
# (≈7 s on a laptop, ≈25 s on standard-3's vCPU), so the largest shape: 4 vCPU, 12 GiB.
instance_type = "standard-4"

# Spec 400 W1c — the wake queue: produced after a message is ADMITTED into a member that declared a host; consumed
