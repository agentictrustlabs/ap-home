ASSISTANT_RATE_WINDOW_MS = "600000"
SA_BUDGET_LIMIT_UNITS = "50000"
# Nothing fronts impact-agent yet — the Home talks to this Worker directly, so no gateway assertion is required.
DEMO_REQUIRE_GATEWAY_ASSERTION = "true"   # spec 441 posture — an estate requires the edge's assertion, as faithnet does
MCP_URL = "https://mcp.impact-agent.io"
DEMO_EDGE_URL = "https://edge.impact-agent.io"
# THE HOME'S ISSUER — the one value here that cannot be additive (2026-10-13). `ownConnectIssuer`
# accepts the apex and any single-label subdomain of THIS issuer's registrable domain, so moving it to
# impact-agent.me means a session minted on `imb-home.vercel.app` no longer verifies: everyone signed in
# there signs in again once. That host still SERVES the Home (it is the same Vercel project) — it just
# stops being the identity. Google's authorized redirect URIs must list the new origin too.
BROKER_ISS = "https://www.impact-agent.me"
BROKER_JWKS_URL = "https://www.impact-agent.me/jwks"
DEMO_SSO_AUD = "demo-sso"
ALLOWED_ORIGINS = "https://impact-agent.me,https://www.impact-agent.me,https://*.impact-agent.me,https://imb-home.vercel.app,https://explorer.faithnet.io,https://demo-bible-ontology-faithnet.richardpedersen3.workers.dev,http://localhost:5175,http://127.0.0.1:5175,http://localhost:8795"
# Most-canonical FIRST, and the workers.dev host kept LAST: `resolveAgentHost` parses a hostname against
# EVERY zone here, and an agent card's URL is inside its SIGNED bytes. Removing the old host would stop
# every card published before 2026-10-13 from naming its agent.
A2A_PUBLIC_BASE_DOMAIN = "impact-agent.ai,impact-agent.io,imb-runtime.richardpedersen3.workers.dev"
A2A_SERVES_UNPUBLISHED_NAMES = "true"
# THE LANES THIS ESTATE REACHES BY BINDING (ap-town calls the same thing a lane, for the same reason): a
# Worker's subrequest to a hostname served by another Worker on its OWN Cloudflare account does not come
# back, and the edge answers 522. faithnet never meets this because it shares a zone with its neighbours
# and an in-zone fetch is routed in-process; impact-agent has no zone, so an impact-agent person engaging
# scripture-resolver.svc read "its card answered 522" until this line existed (2026-10-12).
REACH_LANES = '{"scripture.faithnet.io":"LANE_SCRIPTURE"}'
# AKCS, tenant `imb` (adopted 2026-10-11) — the service MAC on the A2A→MCP hop is derived from the tenant
# MAC root, which is what imb-vault verifies with. Declared here and not only on the deployment: a
# `wrangler deploy --env impact-agent` re-asserts this block, and the day the adoption lived only in a live
# secret the next deploy reverted it and every interactions call threw (see the vault's note).
A2A_KMS_BACKEND = "agentic-kms"
AKCS_BASE_URL = "https://kms.faithnet.io"
AKCS_TENANT_ID = "imb"
AKCS_ACCEPTED_PROTECTION_LEVELS = "CVM_WRAPPED,CVM_DERIVED"
# AKCS_TOKEN is a SECRET (wrangler secret put).
# Custody and the relay stay local-aes BY DECISION: this estate's custody root is an in-Worker secret, and
# moving it to the tenant would re-derive every custodian and orphan every person's home.
#
# Each of those two is PINNED, because neither follows from the decision — both default to
# A2A_KMS_BACKEND. Unpinned, the relayer resolves to agentic-kms and demands AKCS_RELAY_KEY_ID, which
# this tenant has no relay key for: every funded call (grant approval, a name purchase) then dies at
# `buildCallUserOp failed — relayer on agentic-kms requires AKCS_RELAY_KEY_ID (no fallback)`.
A2A_RELAYER_KMS_BACKEND = "agentic-kms"  # spec 441 D3 — the relayer signs with an AKCS key, not a Worker secret
A2A_CUSTODY_KMS_BACKEND = "local-aes"
A2A_ALLOW_LOCAL_MASTER_KEY = "true"
# The estate's own service agents, deployed by scripts/bootstrap-estate.mts (salt 0 and salt 1 over its
# interactions key). Never faithnet's: those are custodied by a key this Worker does not hold.
INTERACTIONS_SERVICE_SA = "0xaECe2A964bEE8aCe5C80655c408390F3628217b5"
HARNESS_AGENT_SA = "0x2AB296D4b1d0A3a5C44F8814ffd657a7E8bec97f"
# Spec 434 W3 — the town's model gateway carries this estate's model calls too, under ITS OWN app key and its own
# entitlement (client `impact-agent-runtime`, registered 2026-10-13 against this HARNESS_AGENT_SA: the same five profiles,
# $5/day, attributed to impact-agent). One gateway for the chain, a budget per estate — never faithnet's key.
