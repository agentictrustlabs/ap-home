# spec 362 — the durable executor (Cloudflare Workflows). The instance id IS the harness runRef;
# A2aTaskDO stays the canonical record, this engine is its execution handle. faithnet only.
[[env.faithnet.workflows]]
name = "harness-approval-faithnet"
binding = "HARNESS_WORKFLOW"
class_name = "HarnessApprovalWorkflow"

# ─── Email (spec 365) ────────────────────────────────────────────────────────────────────────────────
# INBOUND is configured in the Cloudflare dashboard, not here: Email Routing → a catch-all rule for the
# zone → "Send to a Worker" → this script. The `email()` handler is exported unconditionally and is only
# ever called for zones actually routed at it, so nothing here needs a flag.
#
# OUTBOUND has two rails and the deployment picks by what it configures (one at a time — ADR-0013):
#   · Cloudflare Email Service — the binding below + `EMAIL_FROM` on a zone onboarded to Email Sending
#     (`wrangler email sending enable faithnet.ai`; `faithnet.ai` is enabled). Sends to ANY address, so it
#     serves invitations. This is the faithnet rail.
#   · SendGrid — `SENDGRID_API_KEY` + `EMAIL_FROM` secrets, for a deployment without the binding.
[[env.faithnet.send_email]]
name = "SEND_EMAIL"

# ══════════════════════════════════════════════════════════════════════════════════════════════════════════
# ── FAITHNET B — a SECOND DEPLOYMENT of the same estate (spec 366 R4 / 376 W3 / 383 W3), 2026-09-09 ──
#
# The same chain, the same vaults (MCP shared), the same Home broker — a different serving plane: its own
# Durable Objects, its own KV, its own zone (`b.faithnet.io`) and its own edge (`edge-b.faithnet.io`). An
# agent lives here when its NAME says so: `atl:a2aEndpoint = https://edge-b.faithnet.io/api/a2a/<name>` and
# `atl:cardUri` on a host below. A routed ask from the first deployment reaches it over the one wire, through
# that card — never by a subdomain convention. It serves NO unpublished name (A2A_SERVES_UNPUBLISHED_NAMES).
[env.faithnet-b]
name = "demo-a2a-faithnet-b"
workers_dev = true

[[env.faithnet-b.routes]]
pattern = "a2a-b.faithnet.io"
custom_domain = true

# Agents this deployment serves get a custom domain each when PLACED here (none now — the faithnet.io zone is at
# Cloudflare's 100-custom-domain limit; the estate's typed hosts ride the *.faithnet.ai wildcard route instead).
