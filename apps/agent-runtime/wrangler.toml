# (digest, stepNonce) — 64 bytes — and a runtime still speaking generation 1 (32 bytes) sees `BadArgsLength` at
# redemption and nothing names the cause. The chain's deployment record says `contractsGeneration: 3`; this says so too.
CONTRACTS_GENERATION = "4"
# The generation-3 contracts on this chain (deployments-hopechain.json), read by key — several hopechain addresses equal
# faithchain's for a DIFFERENT contract (its quorumEnforcer is faithchain's mock USDC), so no value here is copied by sight.
PAYLOAD_CLASSES_ENFORCER = "0x3d3b2320A18017538542Eb97bE58401a851e38a8"
TREASURY_SPEND_POLICY = "0x4a4069a069E8A558DFfC2B8D5145BD263c542804"
ADOPTED_ONTOLOGY_MANIFEST_DIGEST = "0xf64becd4c395e8b7f0d935ca97640a6d4b37fc087ee0073af48f3841ab3361c8"
# Gemini only, as on faithnet (the live-test rule): a provider failure is an error the person sees, never a
# quiet hand-off (ADR-0013). GEMINI_API_KEY is a secret.
ORCHESTRATION_LLM = "gemini"
ORCHESTRATION_ROUTE = "budget"
COMPOSER_MAX_TOKENS = "2400"
PLAN_REGRESSION_DEFAULT = "on"
RESOLVE_CONTEXT_DEFAULT = "on"
PLAN_CONTINUATION_DEFAULT = "on"
SKILL_SELECTION_DEFAULT = "selective"
SKILL_SELECTION_ASKER_CONTEXT = "full"
