# Cloudflare Worker — home-mcp (spec 397). Claude.ai's entrance to a PERSON's own agent: a conformant remote MCP
# server (Streamable HTTP) that is an OAuth 2.1 authorization server toward MCP clients and a registered relying
# app of the Home toward the person. It holds the person's `ask-as-me` delegation to ITS OWN KEY (a secret), never
# a bearer of theirs, and speaks to exactly one thing: the person's agent, as them, under that wire.
name = "home-mcp"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8797

[[durable_objects.bindings]]
name = "STORE"
class_name = "HomeMcpStoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HomeMcpStoreDO"]

[vars]
HOME_ORIGIN = "http://localhost:5373"
A2A_ORIGIN = "http://localhost:8787"
# Spec 410 §1.2 — the estate the ask-as-me wire is hashed on, for the wire refresh after a credential rotation.
CHAIN_ID = "31337"
DELEGATION_MANAGER = ""
AGENT_HOST_PATTERN = "http://localhost:8787"
CLIENT_ID = "home-mcp"
CLIENT_ID_ACT = "home-mcp-act"
ACT_CLIENT_IDS = ""
DEMO_CONNECT_ENABLED = "true"

# ── FAITHNET (chain 34348) ──
[env.faithnet]
name = "home-mcp-faithnet"
account_id = "5da2feaa56593839672948e16c6e809d"
# The connector URL people paste into Claude: `home-mcp.faithnet.io/mcp`. A custom domain on the faithnet.io zone,
# DECLARED here (a trigger made out of band is deleted by the next deploy — the wrangler lesson of 2026-08-30). The
# workers.dev host keeps serving too, so a connection made under it is not ended by this.
routes = [{ pattern = "home-mcp.faithnet.io", custom_domain = true }]

[[env.faithnet.durable_objects.bindings]]
name = "STORE"
class_name = "HomeMcpStoreDO"

[env.faithnet.vars]
AGENT_HOST_PATTERN = "https://{label}.faithnet.ai"
# The Home that signs people in (spec 230) — the one origin that holds credentials.
HOME_ORIGIN = "https://www.faithnet.me"
BROKER_JWKS_URL = "https://www.faithnet.me/jwks"
# Where a person's agent answers `/harness/ask` (the assertion's audience is this origin).
A2A_ORIGIN = "https://a2a.faithnet.io"
# Spec 410 §1.2 — the estate the ask-as-me wire is hashed on (faithchain), for the wire refresh after a rotation.
CHAIN_ID = "34348"
DELEGATION_MANAGER = "0x710cb1bF08C234Df397e0910331e0A29710EF4F7"
# The Home MCP's OWN registration at the Home (`whitelabel.relyingApps`); its key's address is the delegate there.
CLIENT_ID = "home-mcp"
# Spec 397 §11 — the Home's client for the ACT template (`home-mcp-act`); its delegate is HOME_MCP_ACT_KEY's address.
CLIENT_ID_ACT = "home-mcp-act"
# Operator allowlist of client ids that may request scope `act` (a registration that presented ACT_REGISTRATION_SECRET
# is allowed too). Claude's dynamic registration is neither.
ACT_CLIENT_IDS = ""
# The demo personas may connect with no browser (the live gates; spec 392's rule: they sign in openly).
DEMO_CONNECT_ENABLED = "true"
# Secrets: HOME_MCP_PRIVATE_KEY (the key the ask-as-me wires are made to; its address is `delegate` at the Home),
#          HOME_MCP_ACT_KEY (spec 397 §11 — the act-as-me key; a second secret; its address is the `home-mcp-act` delegate),
#          ACT_REGISTRATION_SECRET (a registration presenting it may request scope act — the live gate's path),
#          TOKEN_SECRET (HMAC for opaque tokens' lookup keys).
