# Cloudflare Worker — home-mcp (spec 397). Claude.ai's entrance to a PERSON's own agent: a conformant remote MCP
# server (Streamable HTTP) that is an OAuth 2.1 authorization server toward MCP clients and a registered relying
# app of the Home toward the person. It holds the person's `ask-as-me` delegation to ITS OWN KEY (a secret), never
# a bearer of theirs, and speaks to exactly one thing: the person's agent, as them, under that wire.
name = "home-mcp"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8797

[[durable_objects.bindings]]
name = "STORE"
class_name = "HomeMcpStoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HomeMcpStoreDO"]

[vars]
HOME_ORIGIN = "http://localhost:5373"
A2A_ORIGIN = "http://localhost:8787"
AGENT_HOST_PATTERN = "http://localhost:8787"
CLIENT_ID = "home-mcp"
DEMO_CONNECT_ENABLED = "true"

# ── THIS ESTATE — Home on faithchain (chain 34348), `[env.production]`. Derived from Ring 0's [env.faithnet]
#    by scripts/split/derive-ap-home-env.py (ap-home-estate.json) at extraction; hand-maintained after the cut.
#    Worker `home-mcp` at https://home-mcp.faithnet.io — its own DOs, KV and D1; the Home at https://home-rho-orpin.vercel.app.
#    This is NOT Faithnet: Faithnet is Ring 0's deployment of the same app and is never deployed from here.
[env.production]
name = "home-mcp"
account_id = "5da2feaa56593839672948e16c6e809d"

[[env.production.durable_objects.bindings]]
name = "STORE"
class_name = "HomeMcpStoreDO"

[env.production.vars]
AGENT_HOST_PATTERN = "https://{label}.home-a2a.faithnet.io"
# The Home that signs people in (spec 230) — the one origin that holds credentials.
HOME_ORIGIN = "https://home-rho-orpin.vercel.app"
BROKER_JWKS_URL = "https://home-rho-orpin.vercel.app/jwks"
# Where a person's agent answers `/harness/ask` (the assertion's audience is this origin).
A2A_ORIGIN = "https://home-a2a.faithnet.io"
# The Home MCP's OWN registration at the Home (`whitelabel.relyingApps`); its key's address is the delegate there.
CLIENT_ID = "home-mcp"
# The demo personas may connect with no browser (the live gates; spec 392's rule: they sign in openly).
DEMO_CONNECT_ENABLED = "true"
# Secrets: HOME_MCP_PRIVATE_KEY (the key the ask-as-me wires are made to; its address is `delegate` at the Home),
#          TOKEN_SECRET (HMAC for opaque tokens' lookup keys).

[[env.production.routes]]
pattern = "home-mcp.faithnet.io"
custom_domain = true
