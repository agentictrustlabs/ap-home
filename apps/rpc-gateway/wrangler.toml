# chain-rpc-gateway — the Cloudflare Worker that fronts a private chain RPC origin with per-app tokens,
# a JSON-RPC method allow-list, per-app rate limits and a read cache.
#
# The BARE name below is for `wrangler dev` only. `pnpm run deploy` refuses without `WRANGLER_ENV=<env>`;
# never deploy this file without `--env` — that would publish a NEW Worker called `chain-rpc-gateway`
# instead of updating the live one. A second private chain is another `[env.<name>]`, not another repo.
#
# Bindings are per-env on purpose (wrangler does not inherit vars / kv / DO bindings into envs):
#   TOKENS  — KV: `t:<sha256(token)>` → { app, readRps, writeRps }
#   RATE    — RateLimiter Durable Object (per-app token bucket)
#   ORIGIN  — the private JSON-RPC origin this env fronts
#   ESTIMATE_GAS_CAP — hex gas bound injected into eth_estimateGas when the call sets none
#                      (Besu returns an empty 200 without one on heavy calls and errors when the
#                      cap equals the block gas limit). Empty = never inject (non-Besu chains).
name = "home-rpc"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[vars]
ORIGIN = ""
ESTIMATE_GAS_CAP = ""

[[durable_objects.bindings]]
name = "RATE"
class_name = "RateLimiter"

# Migration history is shared across envs. `v1` is ALREADY APPLIED to the live Worker of every env —
# do not bump or rename it.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# ── THIS ESTATE — Home on faithchain (chain 34348), `[env.production]`. Derived from Ring 0's [env.faithnet]
#    by scripts/split/derive-ap-home-env.py (ap-home-estate.json) at extraction; hand-maintained after the cut.
#    Worker `home-rpc` at https://home-rpc.faithnet.io — its own DOs, KV and D1; the Home at https://home-rho-orpin.vercel.app.
#    This is NOT Faithnet: Faithnet is Ring 0's deployment of the same app and is never deployed from here.
[env.production]
name = "home-rpc"
workers_dev = false
[env.production.vars]
ORIGIN = "https://faithchain-rpc.agentkg.io"
ESTIMATE_GAS_CAP = "0x2dc6c0"

[[env.production.kv_namespaces]]
binding = "TOKENS"
id = "cb0ffa6d074941e48f50367616843d07"

[[env.production.durable_objects.bindings]]
name = "RATE"
class_name = "RateLimiter"

[[env.production.routes]]
pattern = "home-rpc.faithnet.io"
custom_domain = true
