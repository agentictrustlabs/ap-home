name: estate deploy

# faithnet.estate is deployed from master, here, and nowhere else (spec 445 §16). The Home's sign-out walks through its /sso-logout, so a
# by-hand deploy from a branch that lacks a route strands everybody signing out, which happened on 2026-11-05.
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [master]
    paths: ['apps/estate/**', '.github/workflows/estate-deploy.yml']
  workflow_dispatch:

concurrency: estate-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - name: test the site
        run: pnpm --filter ./apps/estate exec vitest run
      - name: deploy
        working-directory: apps/estate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so nothing was deployed."
            exit 1
          fi
          pnpm exec wrangler deploy --env faithnet
      - name: the sign-out route answers
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w '%{http_code}' 'https://faithnet.estate/sso-logout?return=x')
          [ "$code" = 200 ] || { echo "::error::/sso-logout answers $code: sign-out is stranding people"; exit 1; }
